[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "af3Utils"
version = "0.1.0"
description = "Utilitaire for alphafold3 : creation of inputs files, verification execution, suppression alphafold3 files, ..."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Duvert Quentin" }]
dependencies = [
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2",
    "plotly>=6.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
af3Utils = "af3Utils.__main__:main"

# pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
strict = true